name: build

on:
  push:
    branches: [master, develop, 'features/**', 'feat/**', 'ci/**']
  pull_request:
    branches: [master, develop]

jobs:
  build:
    name: build (${{ matrix.container }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - debian:trixie
          - debian:bookworm
          - ubuntu:24.04

    steps:
      - name: install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential libc6-dev ca-certificates git python3 \
            autoconf gettext pkg-config automake libtool libssl-dev \
            libargon2-dev libgcrypt20-dev libgettextpo-dev libsodium-dev

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: configure
        run: ./configure --enable-nls

      - name: build
        run: make

      - name: verify binary
        run: |
          test -x ./src/services
          ls -la ./src/services

